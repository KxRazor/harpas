# Profiles for cargo-nextest. CI runs the tests with the default profile (.github/workflows/ci.yml) and the parity
# harnesses with the `parity` profile (.github/workflows/parity.yml).

[profile.parity]
# Run every test even after a failure, so that one run reports all the differences with vanilla.
fail-fast = false
# Tests that compare with the reference server run for minutes; report them only past two.
slow-timeout = { period = "120s" }
failure-output = "final"

# The longest comparisons start first, so they do not keep a shard running after its other tests have finished.
[[profile.parity.overrides]]
filter = 'binary(structure_start_parity) | binary(ruined_portal_parity) | binary(monument_interior_parity) | binary(stronghold_parity)'
priority = 100

# world_loading starts a server and waits 15 seconds for it to listen, which it can miss while other comparisons
# keep every core busy. It runs on its own.
[[profile.parity.overrides]]
filter = 'binary(world_loading)'
threads-required = "num-test-threads"
