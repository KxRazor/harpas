version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, "area: workspace"]
    commit-message:
      prefix: deps
    ignore:
      # Starting at 3.1.0, the crate uses Unicode 17 instead of Java 25's Unicode 16.
      - dependency-name: unicode_names2
        versions: [">=3.1.0"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, "area: ci"]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, "area: workspace"]
    commit-message:
      prefix: deps
