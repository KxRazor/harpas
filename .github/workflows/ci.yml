name: CI

on:
  push:
    branches: [main]
  pull_request:
  # To run the checks on a branch by hand.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous one. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version and components in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - name: changelog.d/ entries
        run: ci/changelog.sh --check

  check:
    name: build, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS on Intel, because the hosted arm64 runners are short of capacity at busy hours and GitHub cancels
        # a job it cannot place. macOS on arm64 runs nightly and before releases instead, in macos.yml.
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version and components in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      # nextest builds the libraries, binaries, tests and examples, so there is no separate build step. It runs
      # the test binaries at once, where `cargo test` runs one after another, and leaves out the documentation
      # tests, which run after it.
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo nextest run --workspace --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo run -p harpas-bench --example jvm-bridge --locked -- --self-test -- '-Xcheck:jni'

  docs:
    name: documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version and components in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # A link to an item that was renamed, removed or made private fails here.
      - run: cargo doc --workspace --no-deps --locked

  licenses:
    name: dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources
      # The version and components in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about
      - name: THIRD_PARTY_NOTICES.md is up to date
        run: ci/third-party-notices.sh --check
