name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by dependabot-notices.yml after it commits to a Dependabot branch.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous one. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - name: changelog.d/ entries
        run: ci/changelog.sh --check

  check:
    name: build, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs nightly and before releases instead, in macos.yml.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      # cargo test builds the libraries, binaries, tests and examples, so there is no separate build step.
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo run -p harpas-bench --example jvm-bridge --locked -- --self-test -- '-Xcheck:jni'

  licenses:
    name: dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: THIRD_PARTY_NOTICES.md is up to date
        run: ci/third-party-notices.sh --check
