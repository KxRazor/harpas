name: Dependabot notices

# Dependabot changes Cargo.lock but cannot regenerate THIRD_PARTY_NOTICES.md, so its pull requests would fail
# the notices check in CI. This workflow regenerates the file on the pull request branch and commits it.
#
# GitHub holds the workflow runs that this commit starts on the pull request until a maintainer approves them
# with "Approve and run" on the pull request, because the commit is pushed with GITHUB_TOKEN. The checks then
# report on the new commit (CONTRIBUTING.md#checks).

on:
  pull_request:
    paths: [Cargo.lock]

permissions:
  contents: read

jobs:
  notices:
    name: regenerate third-party notices
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      # The version and components in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about
      - run: ci/third-party-notices.sh
      - name: Commit
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet THIRD_PARTY_NOTICES.md; then
            echo "THIRD_PARTY_NOTICES.md is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deps: regenerate third-party notices"
          git push origin "HEAD:$BRANCH"
