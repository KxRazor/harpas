name: Parity

# Differential tests against Mojang's server (docs/parity.md).
# The reference server is used only for tests: it is never committed, cached, uploaded or released.
# Maintainers accept the Minecraft EULA for CI by setting the repository variable MOJANG_EULA_ACCEPTED to "true".
# Without it the job fails, so that a comparison that never ran cannot look like one that passed. Only pull
# requests from forks, which do not receive repository variables, skip instead: they are compared once merged.
# Pull requests compare a reduced sample for a quick answer, and every other run compares the full one.

on:
  push:
    branches: [main]
  pull_request:
  # Also started by dependabot-notices.yml after it commits to a Dependabot branch.
  workflow_dispatch:
    inputs:
      minecraft-version:
        description: Minecraft server version to compare against
        default: "26.1"

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous one. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  MINECRAFT_VERSION: ${{ inputs.minecraft-version || '26.1' }}

jobs:
  select:
    name: select changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      compare: ${{ steps.select.outputs.compare }}
    steps:
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EULA: ${{ vars.MOJANG_EULA_ACCEPTED }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo 'compare=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ] && [ "$EULA" != true ]; then
            echo '::notice::Pull requests from forks are compared with vanilla once they are merged.'
            echo 'compare=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          if grep -qE '^(crates/|ci/|Cargo\.(toml|lock)$|\.github/workflows/parity\.yml$)' <<< "$files"; then
            echo 'compare=true' >> "$GITHUB_OUTPUT"
          else
            echo 'compare=false' >> "$GITHUB_OUTPUT"
          fi

  parity:
    # Rulesets require checks by name, so the name does not include the version. A skipped job counts as passed, so
    # this runs unless `select` decides otherwise, even if `select` itself fails.
    name: parity against vanilla
    needs: select
    if: ${{ !cancelled() && needs.select.outputs.compare != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Download Mojang's server
        env:
          MOJANG_EULA_ACCEPTED: ${{ vars.MOJANG_EULA_ACCEPTED }}
        run: ci/fetch-vanilla-server.sh "$MINECRAFT_VERSION" "$RUNNER_TEMP/vanilla"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      # CI already runs the other tests. A new harness needs no change here if its name ends in `_parity`
      # (docs/parity.md#adding-a-harness).
      - name: Parity harnesses
        env:
          HARPAS_VANILLA_SERVER_DIR: ${{ runner.temp }}/vanilla
          HARPAS_PARITY_SAMPLE: ${{ github.event_name == 'pull_request' && 'reduced' || 'full' }}
        run: cargo test --release --workspace --locked --test '*_parity' --test world_loading
