name: Release

# Builds the `harpas` binary for each platform when a release is published, and attaches it to the release with
# its SHA-256 checksum (docs/releases.md#release-process). macOS joins once its hosted runners are reliable.

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binary:
    name: binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      # The version and components in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo build --release --locked --bin harpas
      - name: The binary's version is the tag's
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          actual=$(target/release/harpas --version)
          if [[ "$actual" != "harpas ${TAG#v}" ]]; then
            echo "harpas --version prints '$actual', but the tag is $TAG" >&2
            exit 1
          fi
      - name: Package
        env:
          TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        # Asset names leave out the build metadata: GitHub does not keep `+` in them.
        run: |
          version=${TAG#v}
          name="harpas-${version%%+*}-$TARGET"
          mkdir "$name"
          cp target/release/harpas"$([[ $TARGET == *windows* ]] && echo .exe)" "$name/"
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md README.md CHANGELOG.md "$name/"
          if [[ $ARCHIVE == zip ]]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          sha256sum "$name.$ARCHIVE" > "$name.$ARCHIVE.sha256"
          echo "ASSETS=$name.$ARCHIVE $name.$ARCHIVE.sha256" >> "$GITHUB_ENV"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" $ASSETS --clobber
