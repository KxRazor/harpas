[workspace]
resolver = "3"
members = ["crates/*"]
# What a plain `cargo build`, `cargo test` or `cargo clippy` covers. harpas-nethernet is left out: the server does
# not link it yet, and its WebRTC and TLS dependencies (str0m, aws-lc-sys) are more than half of a clean build.
# `--workspace`, which CI uses, still covers it, and so does `-p harpas-nethernet`. A new crate is added here.
default-members = [
    "crates/harpas-anvil",
    "crates/harpas-bedrock",
    "crates/harpas-bench",
    "crates/harpas-core",
    "crates/harpas-engine",
    "crates/harpas-java",
    "crates/harpas-jvm",
    "crates/harpas-protocol-bedrock",
    "crates/harpas-protocol-codegen",
    "crates/harpas-protocol-java",
    "crates/harpas-server",
    "crates/harpas-worldgen",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
harpas-core = { path = "crates/harpas-core" }
harpas-anvil = { path = "crates/harpas-anvil" }
harpas-worldgen = { path = "crates/harpas-worldgen" }
harpas-engine = { path = "crates/harpas-engine" }
harpas-protocol-java = { path = "crates/harpas-protocol-java" }
harpas-java = { path = "crates/harpas-java" }
harpas-protocol-codegen = { path = "crates/harpas-protocol-codegen" }
harpas-protocol-bedrock = { path = "crates/harpas-protocol-bedrock" }
harpas-nethernet = { path = "crates/harpas-nethernet" }
harpas-bedrock = { path = "crates/harpas-bedrock" }
harpas-jvm = { path = "crates/harpas-jvm" }

# Every external dependency, so that a version is written once. A crate takes one with `name.workspace = true`
# and adds the features only it needs.
aes = "0.9.3"
base64 = "0.23.1"
cfb8 = "0.9.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
ctr = "0.10.1"
ctrlc = { version = "3.5.2", features = ["termination"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
getrandom = "0.4.3"
indexmap = "2.14.2"
jni = { version = "0.22.4", features = ["invocation"] }
libdeflater = "1.26.1"
log = "0.4.35"
md-5 = "0.11.0"
miniz_oxide = "0.9.1"
p384 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
rsa = { version = "0.10.0", features = ["hazmat", "pkcs1v15"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
rustyline = { version = "19.0.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
str0m = { version = "0.25.0", default-features = false, features = ["rust-crypto"] }
subtle = "2.6.1"
toml = "1.1.8"
ureq = { version = "3.5.0", default-features = false, features = ["rustls-no-provider"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zlib-rs = "0.6.8"

# The binaries of a release (`.github/workflows/release.yml`). Link-time optimization across every crate makes
# world generation about 4% faster and the binary 17% smaller, and the build three times longer, so `release`,
# which the parity tests and benchmarks use, stays as it is. Measured with the `worldgen` benchmark of
# harpas-bench.
[profile.dist]
inherits = "release"
lto = "fat"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
