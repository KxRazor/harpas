# Generates the Rust dependency section of THIRD_PARTY_NOTICES.md (ci/third-party-notices.sh).
# Keep `accepted` in sync with `licenses.allow` in deny.toml.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
private = { ignore = true }
ignore-build-dependencies = false
ignore-dev-dependencies = true
