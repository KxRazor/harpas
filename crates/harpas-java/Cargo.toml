[package]
name = "harpas-java"
description = "Java Edition connections: framing, connection states, encryption and compression"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes = "0.9.3"
cfb8 = "0.9.1"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
getrandom = { version = "0.4.3", features = ["sys_rng"] }
harpas-protocol-java.workspace = true
md-5 = "0.11.0"
rsa = { version = "0.10.0-rc.19", features = ["hazmat"] }
sha1 = { version = "0.11.0", features = ["oid"] }
sha2 = { version = "0.11.1", features = ["oid"] }
subtle = "2.6.1"

[lints]
workspace = true
