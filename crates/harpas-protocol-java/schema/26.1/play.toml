# Play state: the game itself.
#
# Partial: the packets a player needs to join a void world, move, see other players and chat. The other
# minecraft-data packets are pending. Limits follow minecraft.wiki's "Java Edition protocol/Packets". Angles
# sent as one byte are 1/256 of a turn. Text components are network NBT.

partial = true

[[clientbound]]
id = 0x00
name = "BundleDelimiter"
mcdata = "bundle_delimiter"
doc = "Starts or ends a bundle: the client applies the packets between two delimiters in the same tick."

[[clientbound]]
id = 0x01
name = "SpawnEntity"
mcdata = "spawn_entity"
doc = "Adds an entity, players included, to the client's world."
fields = [
    { name = "entity_id", type = "varint" },
    { name = "uuid", type = "uuid" },
    { name = "entity_type", type = "varint", doc = "Numeric ID in the `minecraft:entity_type` registry." },
    { name = "x", type = "f64" },
    { name = "y", type = "f64" },
    { name = "z", type = "f64" },
    { name = "velocity", type = "lp_vec3", doc = "Blocks per tick." },
    { name = "pitch", type = "i8" },
    { name = "yaw", type = "i8" },
    { name = "head_yaw", type = "i8" },
    { name = "data", type = "varint", doc = "Meaning depends on the entity type." },
]

[[clientbound]]
id = 0x02
name = "EntityAnimation"
mcdata = "animation"
doc = "Plays an animation on an entity, such as an arm swing."
fields = [
    { name = "entity_id", type = "varint" },
    { name = "animation", type = "Animation" },
]

[[clientbound]]
id = 0x0b
