    { name = "empty_sky_light_mask", type = "array(i64)", doc = "Sections whose sky light is all zero." },
    { name = "empty_block_light_mask", type = "array(i64)" },
    { name = "sky_light", type = "array(bytes(2048))" },
    { name = "block_light", type = "array(bytes(2048))" },
]

[structs.ClockUpdate]
doc = "The state of one world clock."
fields = [
    { name = "clock", type = "varint", doc = "Numeric ID in the clock registry." },
    { name = "total_ticks", type = "varlong" },
    { name = "partial_tick", type = "f32" },
    { name = "rate", type = "f32" },
]

[structs.ChatTypeData]
doc = "A chat type sent inline: how a message is shown and narrated."
fields = [
    { name = "chat", type = "ChatDecoration" },
    { name = "narration", type = "ChatDecoration" },
]

[structs.ChatDecoration]
doc = "A translation key and the parts of a message that fill it."
fields = [
    { name = "translation_key", type = "string(32767)" },
    { name = "parameters", type = "array(ChatDecorationParameter)" },
    { name = "style", type = "nbt" },
]

[structs.ArgumentSignature]
doc = "The signature of a message argument of a command."
fields = [
    { name = "name", type = "string(16)" },
    { name = "signature", type = "fixed(256)" },
]

[structs.PublicKeyData]
doc = "A player's chat signing key, signed by Mojang."
fields = [
    { name = "expires_at", type = "i64", doc = "Milliseconds since the Unix epoch." },
    { name = "key", type = "bytes(512)", doc = "RSA public key, DER encoded." },
    { name = "key_signature", type = "bytes(4096)" },
]

[structs.ProfileProperty]
doc = "Signed profile property, such as the skin."
fields = [
    { name = "name", type = "string(64)" },
    { name = "value", type = "string(32767)" },
    { name = "signature", type = "option(string(1024))" },
]

[unions.PackedSignature]
doc = "A message signature, sent in full or as its index in the client's cache."
tag = "varint"
variants = [
    { name = "Full", tag = 0, type = "fixed(256)" },
    { name = "Cached", default = true, doc = "Index of the signature in the cache, plus one." },
]

[unions.FilterMask]
doc = "Which characters of a chat message the server filtered."
tag = "varint"
variants = [
    { name = "PassThrough", tag = 0 },
    { name = "FullyFiltered", tag = 1 },
    { name = "PartiallyFiltered", tag = 2, type = "array(i64)", doc = "Bit set of the filtered characters." },
]

[flags.AbilityFlags]
doc = "The player's abilities."
repr = "i8"
bits = { invulnerable = 0, flying = 1, may_fly = 2, instant_build = 3 }

[flags.TeleportFlags]
doc = "Which values of a teleport are relative to the current ones."
repr = "u32"
bits = { x = 0, y = 1, z = 2, yaw = 3, pitch = 4, velocity_x = 5, velocity_y = 6, velocity_z = 7, rotate_velocity = 8 }

[flags.MovementFlags]
doc = "Whether the player touches the ground or a wall."
repr = "u8"
bits = { on_ground = 0, horizontal_collision = 1 }

[flags.PlayerInputs]
doc = "The movement keys the player is pressing."
repr = "u8"
bits = { forward = 0, backward = 1, left = 2, right = 3, jump = 4, sneak = 5, sprint = 6 }

[bitfields.BlockPos]
doc = "A block position packed in a long."
repr = "i64"
fields = [
    { name = "x", bits = 26, signed = true },
    { name = "z", bits = 26, signed = true },
    { name = "y", bits = 12, signed = true },
]

[bitfields.PackedXZ]
doc = "A block's position within its chunk column, without the height."
repr = "u8"
fields = [
    { name = "x", bits = 4 },
    { name = "z", bits = 4 },
]

[externs.PlayerInfoUpdates]
reason = "The actions are a bit set, and each entry has the fields of the actions that are set."

