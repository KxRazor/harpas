# Play state: the game itself.
#
# Partial: every packet except the 21 that carry item stacks and their data components, entity metadata,
# particles, the command tree or debug subscriptions. Those come with the gameplay that uses them (ROADMAP.md,
# M4) and are pending. Limits follow minecraft.wiki's "Java Edition protocol/Packets". Angles sent as one byte
# are 1/256 of a turn. Text components are network NBT.

partial = true

[[clientbound]]
id = 0x00
name = "BundleDelimiter"
mcdata = "bundle_delimiter"
doc = "Starts or ends a bundle: the client applies the packets between two delimiters in the same tick."

[[clientbound]]
id = 0x01
name = "SpawnEntity"
mcdata = "spawn_entity"
doc = "Adds an entity, players included, to the client's world."
fields = [
    { name = "entity_id", type = "varint" },
    { name = "uuid", type = "uuid" },
    { name = "entity_type", type = "varint", doc = "Numeric ID in the `minecraft:entity_type` registry." },
    { name = "x", type = "f64" },
    { name = "y", type = "f64" },
    { name = "z", type = "f64" },
    { name = "velocity", type = "lp_vec3", doc = "Blocks per tick." },
    { name = "pitch", type = "i8" },
    { name = "yaw", type = "i8" },
    { name = "head_yaw", type = "i8" },
    { name = "data", type = "varint", doc = "Meaning depends on the entity type." },
]

