[package]
name = "harpas-server"
description = "The Harpas server binary"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "harpas"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
getrandom = "0.4.3"
harpas-engine.workspace = true
harpas-java.workspace = true
harpas-protocol-java.workspace = true
log = "0.4.35"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
rustyline = { version = "19.0.0", default-features = false }
serde_json = "1.0.154"
toml = "1.1.8"
ureq = { version = "3.5.0", default-features = false, features = ["rustls-no-provider"] }

[lints]
workspace = true

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", default-features = false, features = ["term"] }
