[package]
name = "harpas-server"
description = "The Harpas server binary"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "harpas"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
harpas-java.workspace = true
harpas-protocol-java.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
serde_json = "1.0.154"
ureq = { version = "3.5.0", default-features = false, features = ["rustls-no-provider"] }

[lints]
workspace = true
