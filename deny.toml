# Dependency policy, checked in CI with `cargo deny check licenses bans sources`.
# Every allowed license must be compatible with MIT OR Apache-2.0 (docs/licensing.md).

[graph]
all-features = true

[advisories]
ignore = [
    # crypto-bigint 0.5 comes from str0m 0.24 through dimpl and p256/p384 0.13, and has no patched 0.5.x.
    # Remove once str0m moves to elliptic-curve 0.14.
    { id = "RUSTSEC-2026-0387", reason = "no patched crypto-bigint reachable until str0m updates RustCrypto" },
    # The Marvin attack on rsa's PKCS#1 v1.5 decryption. harpas-java does not use it: it decrypts with the raw
    # operation and random blinding, removes the padding in constant time and rejects implicitly
    # (crates/harpas-java/src/crypto.rs). Remove once rsa ships a fixed release.
    { id = "RUSTSEC-2023-0071", reason = "PKCS#1 v1.5 decryption is done in constant time in harpas-java" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Boost: permissive, like MIT. clipboard-win and error-code, through rustyline on Windows.
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[licenses.private]
# Harpas' own crates are `publish = false`; their license is checked by review, not here.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
