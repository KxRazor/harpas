# Dependency policy, checked in CI with `cargo deny check licenses bans sources`.
# Every allowed license must be compatible with MIT OR Apache-2.0 (docs/licensing.md).

[graph]
all-features = true

[advisories]
unmaintained = "all"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Boost: permissive, like MIT. clipboard-win and error-code, through rustyline on Windows.
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # Unicode 16 character names in unicode_names2: permissive data redistribution with attribution,
    # compatible with MIT OR Apache-2.0. Required to match Java 25's named SNBT escapes.
    "Unicode-DFS-2016",
]
confidence-threshold = 0.9

[licenses.private]
# Harpas' own crates are `publish = false`; their license is checked by review, not here.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
